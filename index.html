<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free QR Generator by Afnan Samin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>QR Code Generator</h1>
    <p>Create QR & Download for Free</p>
    
    <input type="text" id="qr-text" placeholder="Enter Your Text/Link Here..." />
    <input type="color" id="qr-color" value="#000000" />
    
    <button onclick="generateQR()">QR Generate</button>
    <button onclick="downloadQR()">JPG Download</button>
    
    <div id="qrcode"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
